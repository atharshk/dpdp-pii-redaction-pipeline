[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-redaction"
version = "0.1.0"
description = "DPDP-compliant PII detection and redaction pipeline for RAG ingestion"
requires-python = ">=3.10"
dependencies = [
    "spacy==3.8.16",
    "presidio-analyzer==2.2.364",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, `tests.fixtures`/`tests.data.cases` imports only resolve
# when pytest is invoked as `python -m pytest` (which puts cwd on
# sys.path) and silently break under a bare `pytest` invocation — exactly
# what happened in CI. pythonpath pins the project root onto sys.path for
# the test session regardless of invocation style.
pythonpath = ["."]
markers = [
    "ner: requires the spaCy/Presidio NER stack and model download",
]
