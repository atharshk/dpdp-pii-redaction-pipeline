[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-redaction"
version = "0.1.0"
description = "DPDP-compliant PII detection and redaction pipeline for RAG ingestion"
requires-python = ">=3.10"
dependencies = [
    "spacy==3.8.16",
    "presidio-analyzer==2.2.364",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ner: requires the spaCy/Presidio NER stack and model download",
]
